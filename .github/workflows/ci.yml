name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite is used without a flag, which needs Node 23.4 or newer.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Includes the perft suite, which verifies move generation against known
        # node counts for Xiangqi's opening position to depth 4 (3,290,240).
        run: npm test

      - name: Build client and server
        run: npm run bundle

      - name: Report bundle sizes
        run: |
          echo "### Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -ah packages/client/dist/assets/*.js packages/server/dist/server.mjs \
            | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
