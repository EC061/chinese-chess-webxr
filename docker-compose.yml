# ============================================================================
# chinese-chess-webxr — deployment
#
#   1. cp .env.example .env    and set SESSION_SECRET (plus PUBLIC_ORIGIN)
#   2. docker compose up -d
#   3. point your reverse proxy at ${BIND_ADDR}:${APP_PORT}
#
# TLS is deliberately not handled here — an external reverse proxy terminates
# it. Two things that proxy must get right, because both fail silently:
#
#   * Serve the app over HTTPS. A headset refuses to start an immersive session
#     on an insecure origin, so plain HTTP cannot run the experience at all.
#   * Pass the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy
#     response headers through untouched. Stripping them costs the page its
#     cross-origin isolation, which costs the AI its SharedArrayBuffer, which
#     drops it from a multi-threaded search to a single worker.
#
# See the README for nginx / Traefik / Caddy snippets that do both.
# ============================================================================

services:
  app:
    image: ${IMAGE:-ghcr.io/ec061/chinese-chess-webxr:latest}
    container_name: xiangqi-app
    restart: unless-stopped
    init: true

    # Published for the reverse proxy. Set BIND_ADDR=127.0.0.1 when the proxy
    # runs on this same host, so the port is not reachable from the network.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-8080}:8080"

    environment:
      # --- required -----------------------------------------------------
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env — generate one with: openssl rand -hex 32}
      # --- gameplay & ratings -------------------------------------------
      ALLOW_GUESTS: ${ALLOW_GUESTS:-true}
      RATE_AI_GAMES: ${RATE_AI_GAMES:-true}
      UNDO_MAKES_UNRATED: ${UNDO_MAKES_UNRATED:-true}
      UNDO_RESPONSE_TIMEOUT_MS: ${UNDO_RESPONSE_TIMEOUT_MS:-30000}
      LEADERBOARD_MIN_GAMES: ${LEADERBOARD_MIN_GAMES:-5}
      # --- capacity -----------------------------------------------------
      MAX_ROOMS: ${MAX_ROOMS:-200}
      MAX_ROOMS_PER_USER: ${MAX_ROOMS_PER_USER:-3}
      ROOM_IDLE_MS: ${ROOM_IDLE_MS:-900000}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-24}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      AUTH_RATE_WINDOW_MS: ${AUTH_RATE_WINDOW_MS:-60000}
      AI_REPORT_COOLDOWN_MS: ${AI_REPORT_COOLDOWN_MS:-20000}
      # --- platform -----------------------------------------------------
      # Interface the server listens on *inside* the container. Keep 0.0.0.0 or
      # the published port has nothing to forward to; BIND_ADDR above is what
      # controls whether that port is reachable off this host.
      HOST: ${HOST:-0.0.0.0}
      CROSS_ORIGIN_ISOLATION: ${CROSS_ORIGIN_ISOLATION:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_PATH: ${DATABASE_PATH:-/data/xiangqi.db}

    volumes:
      - xiangqi-data:/data

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xiangqi-data:
